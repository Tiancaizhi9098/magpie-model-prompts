<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模型提示词</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <div><strong class="setting-title">启用模型提示词</strong><p class="subtitle">为不同模型设置自己的提示词，保存后用于后续请求。</p></div>
    <label class="toggle master"><span class="sr-only">启用模型提示词</span><input id="enabled" type="checkbox" checked></label>
  </header>
  <div id="error" class="notice error" role="alert" hidden></div>
  <main class="workspace">
    <aside class="sidebar">
      <div class="list-heading"><strong>我的模型 <span id="count" class="count">0</span></strong><button id="refresh" type="button" class="quiet">刷新</button></div>
      <label class="sr-only" for="search">搜索模型</label><input id="search" type="search" placeholder="搜索模型或供应商…" autocomplete="off">
      <div id="models" class="model-list" role="list" aria-label="模型列表"></div>
      <p id="catalog-status" class="catalog-status" aria-live="polite">正在识别 Magpie 模型…</p>
    </aside>
    <section class="editor" aria-label="模型提示词编辑器">
      <div id="empty" class="empty"><h2>选择模型</h2><p>选择左侧模型，粘贴它专用的提示词。<br>新增模型后点击刷新。</p></div>
      <div id="editing" hidden>
        <div class="editor-heading"><div><h2 id="model-name"></h2><code id="model-id"></code></div><label class="toggle"><span>启用</span><input id="rule-enabled" type="checkbox" checked></label></div>
        <div class="position-row"><label for="position">插入位置</label><select id="position"><option value="prepend">头部 · 原提示词之前</option><option value="append" selected>末尾 · 原提示词之后</option></select></div>
        <div class="field-heading"><label for="prompt">自定义提示词</label><span id="length">0 字</span></div>
        <textarea id="prompt" placeholder="把这个模型专用的提示词粘贴到这里。&#10;&#10;例如：&#10;始终使用简体中文。先给结论，再说明关键依据。修改代码后完成必要验证。" spellcheck="false"></textarea>
        <p id="position-hint" class="hint">保留原有系统提示词，在末尾加入这段内容。留空即不添加。</p>
      </div>
      <footer class="editor-footer"><span id="save-status" role="status">正在连接 Magpie…</span><button id="save" class="primary" type="button" disabled>保存全部</button></footer>
    </section>
  </main>
  <p class="footnote">支持 Claude Code、Codex、OpenCode 等经过 Magpie 的请求。路由组使用实际落到的模型提示词。</p>
</body>
</html>
